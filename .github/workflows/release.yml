name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p _pkg/study-assistant
          git ls-files -z | rsync -a --from0 --files-from=- ./ _pkg/study-assistant/
          cp -a frontend/dist _pkg/study-assistant/frontend/dist
          archive="study-assistant-${RELEASE_TAG}.zip"
          (cd _pkg && zip -r -q "../$archive" study-assistant)
          unzip -tq "$archive"
          sha256sum "$archive" > "$archive.sha256"
          awk -v version="${RELEASE_TAG#v}" '
            index($0, "## [" version "]") == 1 { recording = 1; next }
            recording && /^## / { exit }
            recording { print }
          ' CHANGELOG.md > _pkg/release-notes.md

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: _pkg/release-notes.md
          fail_on_unmatched_files: true
          files: |
            study-assistant-${{ github.ref_name }}.zip
            study-assistant-${{ github.ref_name }}.zip.sha256
